<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 検索に出さない。店頭のQRと、口コミのお願いメールから開くページ -->
<meta name="robots" content="noindex, nofollow">
<title>Review helper | Kimono Experience, KKR Hotel Osaka</title>
<style>

  :root {
    /* 配色は案A「深い蘇芳と生成り」（2026-10-16）。考え方は <style> 最後の「意匠：案A」のコメント */
    --color-bg: #f7f3ec;           /* 生成り */
    --color-card: #fffdf9;
    --color-accent: #7a2e42;       /* 深い蘇芳 */
    --color-accent-dark: #5e2132;
    --color-brass: #b08d57;        /* くすんだ真鍮色。線と小さな飾りだけに使う（文字には使わない。生成りの上では読みにくい） */
    --color-text: #2a2320;
    --color-muted: #6e6259;        /* 文字として読める濃さ（生成りの上で 5:1 以上） */
    --color-border: #e3dacb;
    --color-error: #c0392b;
    --color-success: #2f7d4f;
    --radius: 2px;
    font-family: "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.6;
  }
  header.hero {
    background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
    color: #fff;
    padding: 28px 20px 24px;
    text-align: center;
  }
  header.hero h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
  }
  header.hero p {
    margin: 0;
    opacity: 0.9;
    font-size: 0.9rem;
  }
  .lang-switch {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
  }
  .lang-switch button {
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.12);
    color: #fff;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .lang-switch button.active {
    background: #fff;
    color: var(--color-accent-dark);
    font-weight: bold;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    margin-top: 0;
    font-size: 1.1rem;
    color: var(--color-accent-dark);
  }
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 480px) {
    .menu-grid { grid-template-columns: 1fr; }
  }
  .menu-option {
    border: 2px solid var(--color-border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .menu-option.selected {
    border-color: var(--color-accent);
    background: #fdf1f3;
  }
  .menu-option .name {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .menu-option .price {
    color: var(--color-accent-dark);
    font-weight: bold;
    font-size: 1.1rem;
  }
  .menu-option .duration {
    font-size: 0.8rem;
    color: var(--color-muted);
  }
  .menu-features {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
    font-size: 0.8rem;
    color: var(--color-text);
    line-height: 1.7;
  }
  .menu-features li {
    padding-left: 1.2em;
    position: relative;
  }
  .menu-features li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--color-accent);
    font-weight: bold;
  }
  /* 「〜なし」の項目は控えめに見せ、含まれないことが一目で分かるようにする */
  .menu-features li.is-absent {
    color: var(--color-muted);
  }
  .menu-features li.is-absent::before {
    content: '—';
    color: var(--color-muted);
    font-weight: normal;
  }
  .menu-option .lead-note {
    font-size: 0.75rem;
    color: var(--color-accent-dark);
    background: #f6ecef;
    border-radius: 4px;
    padding: 2px 6px;
    margin-top: 6px;
    display: inline-block;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: bold;
    margin: 14px 0 6px;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="number"],
  input[type="date"],
  select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    color: var(--color-text);
  }
  .slot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    margin-top: 10px;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px;
  }
  .slot-btn {
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .slot-btn.selected {
    background: var(--color-accent);
    color: #fff;
    border-color: var(--color-accent);
  }
  .slot-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    text-decoration: line-through;
  }
  .field-hint {
    font-size: 0.78rem;
    color: var(--color-muted);
    margin: 4px 0 0;
  }
  .policy-card summary {
    font-weight: bold;
    font-size: 1.05rem;
    color: var(--color-accent-dark);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .policy-card summary::-webkit-details-marker { display: none; }
  .policy-card summary::before {
    content: '▸';
    transition: transform 0.15s;
    display: inline-block;
  }
  .policy-card[open] summary::before { transform: rotate(90deg); }
  .policy-card h3 {
    font-size: 0.9rem;
    margin: 18px 0 6px;
    color: var(--color-text);
  }
  .policy-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  .policy-table td {
    padding: 6px 0;
    border-bottom: 1px solid var(--color-border);
  }
  .policy-table td:last-child {
    text-align: right;
    font-weight: bold;
    white-space: nowrap;
  }
  .policy-note,
  .policy-list {
    font-size: 0.85rem;
    color: var(--color-muted);
  }
  .policy-list { padding-left: 1.2em; margin: 6px 0 0; }
  .policy-list li { margin-bottom: 4px; }
  /* 施術を受ける方の内訳。ラベルとselectを横並びにして縦の圧迫感を減らす */
  .attr-group {
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 0.9rem 1rem 0.6rem;
    margin: 0.4rem 0 1rem;
  }
  .attr-group legend {
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0 0.4rem;
  }
  .attr-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }
  .attr-row label {
    margin: 0;
    font-weight: 400;
    font-size: 0.95rem;
    flex: 1 1 auto;
  }
  .attr-row select {
    flex: 0 0 5.5rem;
    margin: 0;
  }
  /* 合計が一致しないときだけ赤くする。既定は控えめな注記 */
  .attr-total { margin-top: 0.5rem; }
  .attr-total.is-error { color: var(--color-error); font-weight: 600; }

  /* 料金が1名分であることを価格の直後に必ず出す。
     人数分を掛けた総額と誤解されると当日の会計でもめる */
  .menu-option .per-person {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--color-muted);
    white-space: nowrap;
  }

  /* 国番号と番号本体を横並びに。国番号は内容に応じて幅を取る */
  .phone-row {
    display: flex;
    gap: 0.5rem;
    align-items: stretch;
  }
  .phone-row select {
    flex: 0 0 auto;
    max-width: 45%;
    margin: 0;
  }
  .phone-row input {
    flex: 1 1 auto;
    min-width: 0;   /* flex内でinputが縮まずはみ出すのを防ぐ */
    margin: 0;
  }

  /* 同意チェック。タップ範囲を文言全体に広げる */
  .agree-row {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    margin: 1rem 0 0.5rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-weight: 400;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .agree-row input {
    flex: 0 0 auto;
    width: 1.15rem;
    height: 1.15rem;
    margin: 0.1rem 0 0;
    accent-color: var(--color-accent, #7a2f3a);
    cursor: pointer;
  }
  /* 未同意で送信しようとしたときだけ強調する */
  .agree-row.is-error {
    border-color: var(--color-error);
    background: rgba(192, 57, 43, 0.05);
  }

  .honeypot {
    position: absolute;
    left: -9999px;
    top: -9999px;
    opacity: 0;
    height: 0;
    width: 0;
  }
  .submit-btn {
    width: 100%;
    background: var(--color-accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
  }
  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-top: 12px;
  }
  .msg.error {
    background: #fdecea;
    color: var(--color-error);
    border: 1px solid #f5c6cb;
  }
  .msg.success {
    background: #eaf6ee;
    color: var(--color-success);
    border: 1px solid #c3e6cb;
  }
  .hidden { display: none !important; }
  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    padding: 4px 0;
  }
  .summary-row.total {
    font-weight: bold;
    font-size: 1.05rem;
    border-top: 1px solid var(--color-border);
    margin-top: 6px;
    padding-top: 8px;
  }
  .complete-box {
    text-align: center;
    padding: 30px 20px;
  }
  .complete-box .big-check {
    font-size: 3rem;
    color: var(--color-success);
  }
  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--color-muted);
    padding: 20px;
  }
  footer .official-link { margin: 10px 0 0; }
  footer .official-link a { color: inherit; text-decoration: underline; }
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }


  /* 地図。高さを固定しつつ、幅は端末に合わせる */
  .map-wrap {
    position: relative;
    width: 100%;
    height: 320px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--color-border);
    margin-bottom: 12px;
  }
  .map-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* 経路ボタン。現地で押されるので、指で押しやすい大きさにする */
  .map-btn {
    display: block;
    text-align: center;
    padding: 14px 16px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
  .addr-line { font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
  /* 本文中のリンク。経路ボタンほど強くせず、押せることは分かるようにする */
  .access-link {
    display: inline-block;
    color: var(--color-accent-dark);
    font-weight: 600;
    text-decoration: underline;
    padding: 4px 0;
  }
  .access-list { padding-left: 1.2em; margin: 6px 0 0; }
  .access-list li { margin-bottom: 6px; }
  .back-link { display: inline-block; margin-top: 8px; }

  /* ===========================================================
     意匠：案A「深い蘇芳と生成り」（2026-10-16）

     【考え方】足すより引く。
     ・余白を広く、色を絞る（墨・生成り・蘇芳・細い真鍮色の線）
     ・濃いグラデーション、太い枠、大きな角丸、丸いボタンをやめる
     ・見出しと価格は明朝体。本文は読みやすいゴシックのまま
     ・動作・文言・構造は変えない（色と形と書体だけ）

     【守っていること】
     ・文字色と背景のコントラストは 4.5:1 以上（真鍮色は線だけに使う）
     ・外部の書体は読み込まない（端末に入っている明朝体を指定。表示を重くしない）
     ・言語ごとに書体を分ける（日本語・中国語・韓国語は別の明朝系）
     =========================================================== */
  :root { --font-serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "MS PMincho", serif; }
  :root:lang(en), :root:lang(fr) { --font-serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif; }
  :root:lang(zh-CN) { --font-serif: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif; }
  :root:lang(zh-TW) { --font-serif: "Songti TC", "PMingLiU", "MingLiU", "Noto Serif TC", serif; }
  :root:lang(ko) { --font-serif: "AppleMyungjo", "Batang", "Noto Serif KR", serif; }

  ::selection { background: rgba(176, 141, 87, 0.3); }
  body { -webkit-font-smoothing: antialiased; }

  /* ヘッダー：濃い帯をやめ、生成りの上に文字と細い線だけにする */
  header.hero {
    background: none;
    color: var(--color-text);
    padding: 40px 20px 18px;
  }
  .hero-emblem {
    display: block;
    width: 36px;
    height: 36px;
    margin: 0 auto 16px;
    color: var(--color-brass);
  }
  header.hero h1 {
    margin: 0;
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(1.45rem, 6vw, 1.9rem);
    letter-spacing: 0.16em;
    /* 字間を空けると、最後の文字の右にも空きが付いて中央からずれて見える */
    padding-left: 0.16em;
  }
  header.hero p {
    margin: 10px 0 0;
    opacity: 1;
    color: var(--color-muted);
    font-size: 0.78rem;
    letter-spacing: 0.16em;
  }
  header.hero p::after {
    content: '';
    display: block;
    width: 44px;
    height: 1px;
    margin: 20px auto 0;
    background: var(--color-brass);
  }
  /* 言語の切り替え：丸いボタンをやめ、細い縦線で区切った文字にする。
     狭い画面は3つずつ2段にする（折り返しで区切り線が行頭に残るのを避ける）。 */
  .lang-switch {
    display: grid;
    grid-template-columns: repeat(3, auto);
    justify-content: center;
    gap: 2px 0;
    margin-top: 12px;
  }
  .lang-switch button {
    position: relative;
    border: 0;
    background: none;
    color: var(--color-muted);
    padding: 6px 12px;
    border-radius: 0;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }
  .lang-switch button + button::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    width: 1px;
    height: 12px;
    background: var(--color-border);
    transform: translateY(-50%);
  }
  .lang-switch button:nth-child(3n+1)::before { display: none; }
  .lang-switch button.active {
    background: none;
    color: var(--color-accent);
    font-weight: 600;
    box-shadow: inset 0 -1px 0 var(--color-brass);
  }
  @media (min-width: 560px) {
    .lang-switch { display: flex; }
    .lang-switch button + button:nth-child(3n+1)::before { display: block; }
  }

  /* 区画：角を落とし、余白を広げる。見出しの下に短い真鍮色の線 */
  .card {
    border-radius: 2px;
    padding: 26px 22px;
    margin-bottom: 22px;
  }
  .card h2 {
    position: relative;
    margin: 0 0 18px;
    padding-bottom: 12px;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.15rem;
    letter-spacing: 0.06em;
    color: var(--color-text);
  }
  .card h2::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 28px;
    height: 1px;
    background: var(--color-brass);
  }
  .policy-card summary {
    font-family: var(--font-serif);
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--color-text);
  }

  /* プラン：選んだ状態は、ピンクの塗りではなく細い二重線で示す */
  .menu-option {
    border: 1px solid var(--color-border);
    border-radius: 2px;
    padding: 18px 16px;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .menu-option:hover { border-color: #cdbfa8; }
  .menu-option.selected {
    border-color: var(--color-accent);
    background: var(--color-card);
    box-shadow: inset 0 0 0 1px var(--color-accent);
  }
  .menu-option .name {
    margin-bottom: 6px;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
  }
  .menu-option .price {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.25rem;
    line-height: 1.4;
    letter-spacing: 0.03em;
    color: var(--color-accent);
  }
  .menu-option .duration { letter-spacing: 0.06em; }
  .menu-features li::before { font-weight: normal; }
  .menu-option .lead-note { background: #f3ece0; border-radius: 2px; }

  /* 入力欄：角を小さく、枠を細く。選んだとき（フォーカス）は蘇芳の線と淡い縁取り */
  label {
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="number"],
  input[type="date"],
  select,
  textarea {
    border-radius: 2px;
    border-color: #d8ccb9;
    background: #fffefb;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(122, 46, 66, 0.12);
  }
  .attr-group, .agree-row { border-radius: 2px; border-color: #d8ccb9; }
  .attr-row select:disabled { background: #efe9df; }
  .hotel-box { border-radius: 2px; background: #fbf8f2; }
  .constraint-note { background: #f6efe3; border-left-width: 2px; }

  /* 時間の枠 */
  .slot-btn {
    border-radius: 2px;
    background: #fffefb;
    letter-spacing: 0.04em;
    transition: border-color 0.2s;
  }
  .slot-btn:hover:not(:disabled):not(.selected) { border-color: var(--color-accent); }

  /* ボタン：ほぼ直角。英語・フランス語は大文字にして字間を広げる */
  .submit-btn {
    border-radius: 2px;
    /* 直後に区画が続くので、くっつかないよう下に余白 */
    margin-bottom: 22px;
    padding: 16px;
    font-weight: 500;
    letter-spacing: 0.14em;
    transition: background 0.25s;
  }
  .submit-btn:hover:not(:disabled) { background: var(--color-accent-dark); }
  :root:lang(en) .submit-btn, :root:lang(fr) .submit-btn {
    font-size: 0.95rem;
    text-transform: uppercase;
  }
  .photo-btn, .gallery-btn, .switch-btn, .cancel-link {
    border-radius: 2px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  /* メッセージ・合計・完了 */
  .msg { border-radius: 2px; }
  .msg.error { background: #fbefec; border-color: #ecc9c2; }
  .msg.success { background: #f1f5ee; border-color: #d5e0cc; }
  .summary-row.total {
    margin-top: 10px;
    padding-top: 12px;
    border-top-color: var(--color-brass);
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.15rem;
  }
  .policy-table td:last-child { font-weight: 500; }
  .complete-box .big-check { color: var(--color-accent); font-weight: 300; }
  .complete-box h2::after { left: 50%; transform: translateX(-50%); }

  /* フッター：細い線で本文と区切り、明朝体で静かに */
  footer {

  var LANGS = [
    { code: 'ja', label: '日本語' }, { code: 'en', label: 'English' },
    { code: 'zh-CN', label: '简体中文' }, { code: 'zh-TW', label: '繁體中文' },
    { code: 'ko', label: '한국어' }, { code: 'fr', label: 'Français' }
  ];
  var CHIP_STEPS = ['why', 'did', 'value'];

  // 画面全体の状態。選択肢は「番号」で持つので、言語を切り替えても崩れない。
  var state = {
    lang: 'en',
    view: 'intro',                 // intro | why | did | value | detail | result
    sel: { why: [], company: [], did: [], value: [] },
    text: { why: '', company: '', did: '', value: '', detail: '', improve: '' },
    followup: '', followupKey: '', followupLoading: false,
    draft: '', draftError: false, busy: false,
    ai: null,                      // null＝まだ分からない／true＝使える／false＝使えない（キー未設定・止めている）
    reviewUrl: DEFAULT_REVIEW_URL
  };

  function t(key) {
    var d = I18N[state.lang] || I18N.en;
    return d[key] !== undefined ? d[key] : I18N.en[key];
  }

  // ?lang= があればそれ。無ければブラウザの言語から。
  function detectLang() {
    var m = /[?&]lang=([\w-]+)/.exec(location.search);
    if (m && I18N[m[1]]) return m[1];
    var list = navigator.languages || [navigator.language || 'en'];
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i]).toLowerCase();
      if (l.indexOf('ja') === 0) return 'ja';
      if (l.indexOf('ko') === 0) return 'ko';
      if (l.indexOf('fr') === 0) return 'fr';
      if (l.indexOf('zh') === 0) return /tw|hk|mo|hant/.test(l) ? 'zh-TW' : 'zh-CN';
      if (l.indexOf('en') === 0) return 'en';
    }
    return 'en';
  }

  // DOM要素を作る。文字は必ずテキストとして入れる（入力内容でHTMLが壊れない）
  function h(tag, props) {
    var el = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) if (kids[j] != null && kids[j] !== false) el.append(kids[j]);
    }
    return el;
  }

  function toast(message) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  // クリップボードにコピーする。使えない端末向けの代わりの方法つき
  function copyText(text) {
    var fallback = function () {
      var ta = h('textarea', { 'aria-hidden': 'true', style: 'position:fixed;opacity:0' });
      ta.value = text;
      document.body.append(ta);
      ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) { /* 何もしない */ }
      ta.remove();
      return done;
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  // ---------- GAS との通信（GET は設定、POST は質問・下書き）。失敗したら例外 ----------
  function withTimeout(ms) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, ms) : 0;
    return { signal: ctrl ? ctrl.signal : undefined, done: function () { clearTimeout(timer); } };
  }
  function readJson(res) {
    return res.json().catch(function () { return null; }).then(function (data) {
      if (!res.ok || !data) throw new Error('http_' + res.status);
      return data;
    });
  }
  function apiPost(body) {
    var to = withTimeout(40000);
    body.a = 'review';
    return fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // application/json にしない（GAS が受けられなくなる）
      body: JSON.stringify(body),
      signal: to.signal
    }).then(readJson).then(function (data) {
      to.done();
      if (data.status !== 'ok') throw new Error(data.code || 'error');
      return data;
    }, function (err) { to.done(); throw err; });
  }
  function apiConfig() {
    var to = withTimeout(15000);
    return fetch(GAS_URL + '?a=reviewcfg', { signal: to.signal }).then(readJson).then(function (data) {
      to.done();
      return data;
    }, function (err) { to.done(); throw err; });
  }

  // 1つの質問の回答を「選んだ項目 + 自由記入」の文字列にまとめる
  function answerText(key) {
    var chips = t(key + 'Chips');
    var labels = state.sel[key].map(function (i) { return chips[i]; });
    return labels.concat([(state.text[key] || '').trim()]).filter(Boolean).join('; ');
  }
  function collectAnswers() {
    return {
      why: answerText('why'), company: answerText('company'), did: answerText('did'), value: answerText('value'),
      detail: state.text.detail.trim(), improve: state.text.improve.trim()
    };
  }
  function hasAnyAnswer() {
    return state.sel.company.length > 0 || CHIP_STEPS.some(function (k) { return state.sel[k].length > 0 || state.text[k].trim(); });
  }
  function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  // ---------- 画面 ----------
  function stepBar(n) {
    var bars = [1, 2, 3, 4].map(function (i) { return h('i', { class: i < n ? 'done' : (i === n ? 'now' : '') }); });
    return h('div', { class: 'rv-steps', role: 'img', 'aria-label': n + '/4' },
      h('span', { class: 'rv-steps-n' }, n + '/4'), h('span', { class: 'rv-steps-bar' }, bars));
  }

  function viewIntro() {
    var langs = h('div', { class: 'rv-langs', role: 'group', 'aria-label': 'Language' },
      LANGS.map(function (l) {
        return h('button', {
          type: 'button', class: 'rv-lang', lang: l.code, 'aria-pressed': String(l.code === state.lang),
          onclick: function () { state.lang = l.code; render(); }
        }, l.label);
      }));
    return h('section', null,
      h('p', { class: 'rv-langlabel' }, t('langLabel')),
      langs,
      h('p', { class: 'rv-lead' }, t('lead')),
      h('p', { class: 'rv-hint' }, t('note')),
      h('p', { class: 'rv-hint' }, t('privacy')),
      h('div', { class: 'rv-bar' }, h('button', { type: 'button', class: 'submit-btn', onclick: function () { go('why'); } }, t('begin'))));
  }

  function viewChipStep(key) {
    var idx = CHIP_STEPS.indexOf(key);
    var need = h('p', { class: 'rv-hint warn', role: 'alert', hidden: true }, t('needOne'));
    var chips = h('div', { class: 'rv-chips', role: 'group', 'aria-labelledby': 'rvTitle' },
      t(key + 'Chips').map(function (label, i) {
        var btn = h('button', {
          type: 'button', class: 'rv-chip', 'aria-pressed': String(state.sel[key].indexOf(i) !== -1),
          onclick: function () {
            var list = state.sel[key];
            var at = list.indexOf(i);
            if (at === -1) list.push(i); else list.splice(at, 1);
            btn.setAttribute('aria-pressed', String(at === -1));
            need.hidden = true;
          }
        }, label);
        return btn;
      }));
    // 例文（薄い文字）は placeholder。入力欄を選ぶ（タップする）と消える。お客様の答えには入らない。見出しは、例文が消えても残る
    var ta = h('textarea', {
      class: 'rv-text', id: 'otherText', rows: '2', maxlength: '500', autocomplete: 'off', placeholder: t('ex' + key.charAt(0).toUpperCase() + key.slice(1)),
      oninput: function () { state.text[key] = ta.value; need.hidden = true; }
    });
    ta.value = state.text[key];
    var prev = idx === 0 ? 'intro' : CHIP_STEPS[idx - 1];
    var onNext = function () {
      if (key === 'value' && !hasAnyAnswer()) { need.hidden = false; return; }
      go(key === 'value' ? 'detail' : CHIP_STEPS[idx + 1]);
    };
    // 1問目には「どなたと来ましたか」を添える（タップだけ。答えなくてよい）。口コミを読む人には、誰に向いているかが伝わる
    // 置き場所は、きっかけの選択肢のすぐ下（自由記入の欄より上。下にあると、気づかずに「次へ」を押す）
    var company = key !== 'why' ? null : h('div', { class: 'rv-company' },
      h('p', { class: 'rv-q2', id: 'companyLabel' }, t('companyLabel')),
      h('div', { class: 'rv-chips', role: 'group', 'aria-labelledby': 'companyLabel', id: 'companyChips' },
        t('companyChips').map(function (label, i) {
          var b = h('button', {
            type: 'button', class: 'rv-chip', 'aria-pressed': String(state.sel.company.indexOf(i) !== -1),
            onclick: function () {
              var list = state.sel.company;
              var at = list.indexOf(i);
              if (at === -1) list.push(i); else list.splice(at, 1);
              b.setAttribute('aria-pressed', String(at === -1));
              need.hidden = true;
            }
          }, label);
          return b;
        })));
    return h('section', null,
      stepBar(idx + 1),
      h('h2', { class: 'rv-title', id: 'rvTitle' }, t(key + 'Title')),
      h('p', { class: 'rv-hint' }, t('pickHint')),
      chips,
      company,
      h('div', { class: 'rv-field' }, h('label', { class: 'rv-sub', for: 'otherText' }, t('other')), ta),
      need,
      h('div', { class: 'rv-bar' },
        h('button', { type: 'button', class: 'rv-link', onclick: function () { go(prev); } }, t('back')),
        h('button', { type: 'button', class: 'submit-btn', onclick: onNext }, t('next'))));
  }

  function viewDetail() {
    // 質問の取りに行く・定型の質問への切り替えは、先にやる（欄を作る前に状態が決まっていないと、質問の欄が空のままになる）
    loadFollowup();
    var q = h('p', { class: 'rv-q', id: 'followupQ' }, state.followupLoading ? t('qLoading') : state.followup);
    var ta = h('textarea', {
      class: 'rv-text', id: 'detailText', rows: '3', maxlength: '500', autocomplete: 'off', placeholder: t('exDetail'),
      'aria-labelledby': 'followupQ', oninput: function () { state.text.detail = ta.value; }
    });
    ta.value = state.text.detail;
    var improve = h('textarea', {
      class: 'rv-text', id: 'improveText', rows: '2', maxlength: '500', autocomplete: 'off', placeholder: t('exImprove'),
      oninput: function () { state.text.improve = improve.value; }
    });
    improve.value = state.text.improve;
    var make = h('button', { type: 'button', class: 'submit-btn', id: 'makeBtn', onclick: function () { makeDrafts(make); } }, t('make'));
    return h('section', null,
      stepBar(4),
      h('h2', { class: 'rv-title', id: 'rvTitle' }, t('detailTitle')),
      h('p', { class: 'rv-hint' }, t('detailHint')),
      h('div', { class: 'rv-field' }, q, ta),
      h('div', { class: 'rv-field' }, h('label', { for: 'improveText' }, t('improveLabel')), improve),
      h('div', { class: 'rv-bar' },
        h('button', { type: 'button', class: 'rv-link', onclick: function () { go('value'); } }, t('back')), make));
  }

  function viewResult() {
    // AI を使えないと分かっている（キー未設定など）ときは、「失敗」ではなく、ふつうの下書きとして見せる。失敗したときだけ、注意を赤字で出す
    var plain = state.draftError && state.ai === false;
    var ta = h('textarea', {
      id: 'draftText', 'aria-label': t('resultTitle'),
      oninput: function () { state.draft = ta.value; autosize(ta); }
    });
    ta.value = state.draft;
    // 押した瞬間にコピーする（コピーは、押す操作の中で始めないと、スマホで止められることがある）
    var doCopy = function () { copyText(ta.value).then(function (ok) { toast(ok ? t('copied') : t('copyFail')); }); };
    // 主ボタン：コピーして、そのまま Google マップの口コミ画面を開く（リンクの動きは止めない）
    var open = state.reviewUrl
      ? h('a', { class: 'submit-btn rv-open', id: 'openLink', href: state.reviewUrl, target: '_blank', rel: 'noopener noreferrer', onclick: doCopy }, t('open'))
      : null;
    var copyBtn = h('button', { type: 'button', class: open ? 'rv-ghost' : 'submit-btn', id: 'copyBtn', onclick: doCopy }, t('copy'));
    // 主ボタンは、下書きが長くても画面の下に見えているようにする（下の帯に固定）。「コピーだけ」は、その下
    var mainBar = h('div', { class: 'rv-bar' }, open || copyBtn);
    var how = open ? h('div', { class: 'rv-how' },
      h('p', { class: 'rv-how-t' }, t('howTitle')),
      h('ol', null, h('li', null, t('step1')), h('li', null, t('step2')), h('li', null, t('step3')))) : null;
    setTimeout(function () { autosize(ta); }, 0);
    setTimeout(function () { autosize(ta); }, 80);
    return h('section', null,
      h('h2', { class: 'rv-title', id: 'rvTitle' }, plain ? t('plainTitle') : (state.draftError ? t('errorTitle') : t('resultTitle'))),
      plain ? h('p', { class: 'rv-hint' }, t('plainNote'))
        : (state.draftError ? h('p', { class: 'rv-hint warn' }, t('error')) : h('p', { class: 'rv-hint' }, t('resultNote'))),
      h('div', { class: 'rv-draft' }, ta),
      h('p', { class: 'rv-check', id: 'checkNote' }, t('checkNote')),
      mainBar,
      open ? h('div', { class: 'rv-stack' }, copyBtn) : null,
      how,
      h('p', { class: 'rv-small' }, t('after')),
      h('div', { class: 'rv-center' }, h('button', { type: 'button', class: 'rv-link', id: 'restartBtn', onclick: restart }, t('restart'))));
  }

  var VIEWS = {
    intro: viewIntro,
    why: function () { return viewChipStep('why'); },
    did: function () { return viewChipStep('did'); },
    value: function () { return viewChipStep('value'); },
    detail: viewDetail,
    result: viewResult
  };

  function render() {
    document.documentElement.lang = state.lang;
    document.title = t('title');
    document.getElementById('pageH1').textContent = t('h1');
    document.getElementById('pageSub').textContent = t('sub');
    var app = document.getElementById('app');
    app.replaceChildren(VIEWS[state.view]());
    var heading = app.querySelector('h2');
    if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus({ preventScroll: true }); }
  }
  function go(view) {
    state.view = view;
    window.scrollTo(0, 0);
    render();
  }
  function restart() {
    state.sel = { why: [], company: [], did: [], value: [] };
    state.text = { why: '', company: '', did: '', value: '', detail: '', improve: '' };
    state.followup = ''; state.followupKey = ''; state.draftError = false; state.draft = '';
    go('intro');
  }

  // ---------- AI を使う処理（使えない・失敗したときは、入力内容をそのまま使う） ----------
  function loadFollowup() {
    var a = collectAnswers();
    var key = JSON.stringify([state.lang, a.why, a.company, a.did, a.value]);
    if (state.followupKey === key && state.followup) return;
    state.followupKey = key;
    state.followup = '';
    var show = function () {
      var el = document.getElementById('followupQ');
      if (el) el.textContent = state.followupLoading ? t('qLoading') : state.followup;
    };
    // AI が使えないと分かっているときは、定型の質問にする
    if (state.ai === false) { state.followupLoading = false; state.followup = t('fallbackQ'); show(); return; }
    state.followupLoading = true;
    show();
    apiPost({ step: 'followup', lang: state.lang, answers: { why: a.why, company: a.company, did: a.did, value: a.value } }).then(function (res) {
      if (state.followupKey === key) state.followup = res.question;
    }, function () {
      if (state.followupKey === key) state.followup = t('fallbackQ');
    }).then(function () {
      if (state.followupKey === key) { state.followupLoading = false; show(); }
    });
  }

  // AI が使えない・失敗したときの代わりの下書き。お客様が選んだ・書いた内容だけを、読める形に並べる
  // （選択肢の語を「;」でつなぐだけだと、そのまま投稿しにくい。「きっかけ：…」「一緒に来た人：…」「体験したこと：…」「感想：…」の行にする）
  function fallbackDraft() {
    var sep = t('fbSep'), end = t('fbEnd');
    var parts = function (key) {
      var chips = t(key + 'Chips');
      return state.sel[key].map(function (i) { return chips[i]; }).concat([(state.text[key] || '').trim()]).filter(Boolean).join(sep);
    };
    var line = function (label, body) {
      if (!body) return '';
      return label + body + (/[.。!！?？]$/.test(body) ? '' : end);
    };
    var a = collectAnswers();
    return [
      line(t('fbWhy'), parts('why')),
      line(t('fbCompany'), parts('company')),
      line(t('fbDid'), parts('did')),
      line(t('fbValue'), parts('value')),
      a.detail,
      line(t('fbImprove'), a.improve)
    ].filter(Boolean).join('\n');
  }

  // 下書きは1つ（2026-11-24。それまでの「短め・詳しめ」は、詳しめに水増しや言っていない評価が集まり、選ぶ手間も増えたのでやめた）
  function finishDrafts(text, failed) {
    state.draft = failed ? fallbackDraft() : text;
    state.draftError = !!failed;
    state.busy = false;
    go('result');
  }
  function makeDrafts(btn) {
    if (state.busy) return;
    state.busy = true;
    btn.disabled = true;
    btn.textContent = t('making');
    if (state.ai === false) { finishDrafts(null, true); return; }
    apiPost({ step: 'drafts', lang: state.lang, answers: collectAnswers() }).then(function (res) {
      // 新しいGASは review。古いGAS（短め・詳しめ）から返ってきたときは、短めを使う
      var dr = res.drafts || {};
      var text = String(dr.review || dr.short || dr.long || '');
      if (!text.trim()) throw new Error('empty');
      finishDrafts(text, false);
    }).catch(function () {
      if (state.view !== 'result') finishDrafts(null, true);
    });
  }

  // ---------- 起動 ----------
  state.lang = detectLang();
  render();
  apiConfig().then(function (data) {
    var r = data && data.review;
    if (r && typeof r === 'object') {
      state.ai = !!r.ai;
      if (r.reviewUrl) state.reviewUrl = String(r.reviewUrl);
    } else {
      state.ai = false;        // 古いGAS（口コミの窓口が無い）
    }
    if (state.view === 'result') render();
  }, function () { /* 設定が取れなくても、質問には答えられる（AIは試す） */ });
})();
</script>
</body>
</html>
