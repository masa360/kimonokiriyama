<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アクセス｜和装体験 KKRホテル大阪</title>
<style>

  :root {
    --color-bg: #faf7f2;
    --color-card: #ffffff;
    --color-accent: #a6304c;
    --color-accent-dark: #7c2138;
    --color-text: #2b2320;
    --color-muted: #8a7d74;
    --color-border: #e6ddd3;
    --color-error: #c0392b;
    --color-success: #2f7d4f;
    --radius: 10px;
    font-family: "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.6;
  }
  header.hero {
    background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
    color: #fff;
    padding: 28px 20px 24px;
    text-align: center;
  }
  header.hero h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
  }
  header.hero p {
    margin: 0;
    opacity: 0.9;
    font-size: 0.9rem;
  }
  .lang-switch {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
  }
  .lang-switch button {
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.12);
    color: #fff;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .lang-switch button.active {
    background: #fff;
    color: var(--color-accent-dark);
    font-weight: bold;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    margin-top: 0;
    font-size: 1.1rem;
    color: var(--color-accent-dark);
  }
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 480px) {
    .menu-grid { grid-template-columns: 1fr; }
  }
  .menu-option {
    border: 2px solid var(--color-border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .menu-option.selected {
    border-color: var(--color-accent);
    background: #fdf1f3;
  }
  .menu-option .name {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .menu-option .price {
    color: var(--color-accent-dark);
    font-weight: bold;
    font-size: 1.1rem;
  }
  .menu-option .duration {
    font-size: 0.8rem;
    color: var(--color-muted);
  }
  .menu-features {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
    font-size: 0.8rem;
    color: var(--color-text);
    line-height: 1.7;
  }
  .menu-features li {
    padding-left: 1.2em;
    position: relative;
  }
  .menu-features li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--color-accent);
    font-weight: bold;
  }
  /* 「〜なし」の項目は控えめに見せ、含まれないことが一目で分かるようにする */
  .menu-features li.is-absent {
    color: var(--color-muted);
  }
  .menu-features li.is-absent::before {
    content: '—';
    color: var(--color-muted);
    font-weight: normal;
  }
  .menu-option .lead-note {
    font-size: 0.75rem;
    color: var(--color-accent-dark);
    background: #f6ecef;
    border-radius: 4px;
    padding: 2px 6px;
    margin-top: 6px;
    display: inline-block;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: bold;
    margin: 14px 0 6px;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="number"],
  input[type="date"],
  select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    color: var(--color-text);
  }
  .slot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    margin-top: 10px;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px;
  }
  .slot-btn {
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .slot-btn.selected {
    background: var(--color-accent);
    color: #fff;
    border-color: var(--color-accent);
  }
  .slot-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    text-decoration: line-through;
  }
  .field-hint {
    font-size: 0.78rem;
    color: var(--color-muted);
    margin: 4px 0 0;
  }
  .policy-card summary {
    font-weight: bold;
    font-size: 1.05rem;
    color: var(--color-accent-dark);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .policy-card summary::-webkit-details-marker { display: none; }
  .policy-card summary::before {
    content: '▸';
    transition: transform 0.15s;
    display: inline-block;
  }
  .policy-card[open] summary::before { transform: rotate(90deg); }
  .policy-card h3 {
    font-size: 0.9rem;
    margin: 18px 0 6px;
    color: var(--color-text);
  }
  .policy-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  .policy-table td {
    padding: 6px 0;
    border-bottom: 1px solid var(--color-border);
  }
  .policy-table td:last-child {
    text-align: right;
    font-weight: bold;
    white-space: nowrap;
  }
  .policy-note,
  .policy-list {
    font-size: 0.85rem;
    color: var(--color-muted);
  }
  .policy-list { padding-left: 1.2em; margin: 6px 0 0; }
  .policy-list li { margin-bottom: 4px; }
  /* 施術を受ける方の内訳。ラベルとselectを横並びにして縦の圧迫感を減らす */
  .attr-group {
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 0.9rem 1rem 0.6rem;
    margin: 0.4rem 0 1rem;
  }
  .attr-group legend {
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0 0.4rem;
  }
  .attr-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }
  .attr-row label {
    margin: 0;
    font-weight: 400;
    font-size: 0.95rem;
    flex: 1 1 auto;
  }
  .attr-row select {
    flex: 0 0 5.5rem;
    margin: 0;
  }
  /* 合計が一致しないときだけ赤くする。既定は控えめな注記 */
  .attr-total { margin-top: 0.5rem; }
  .attr-total.is-error { color: var(--color-error); font-weight: 600; }

  /* 料金が1名分であることを価格の直後に必ず出す。
     人数分を掛けた総額と誤解されると当日の会計でもめる */
  .menu-option .per-person {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--color-muted);
    white-space: nowrap;
  }

  /* 国番号と番号本体を横並びに。国番号は内容に応じて幅を取る */
  .phone-row {
    display: flex;
    gap: 0.5rem;
    align-items: stretch;
  }
  .phone-row select {
    flex: 0 0 auto;
    max-width: 45%;
    margin: 0;
  }
  .phone-row input {
    flex: 1 1 auto;
    min-width: 0;   /* flex内でinputが縮まずはみ出すのを防ぐ */
    margin: 0;
  }

  /* 同意チェック。タップ範囲を文言全体に広げる */
  .agree-row {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    margin: 1rem 0 0.5rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-weight: 400;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .agree-row input {
    flex: 0 0 auto;
    width: 1.15rem;
    height: 1.15rem;
    margin: 0.1rem 0 0;
    accent-color: var(--color-accent, #7a2f3a);
    cursor: pointer;
  }
  /* 未同意で送信しようとしたときだけ強調する */
  .agree-row.is-error {
    border-color: var(--color-error);
    background: rgba(192, 57, 43, 0.05);
  }

  .honeypot {
    position: absolute;
    left: -9999px;
    top: -9999px;
    opacity: 0;
    height: 0;
    width: 0;
  }
  .submit-btn {
    width: 100%;
    background: var(--color-accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
  }
  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-top: 12px;
  }
  .msg.error {
    background: #fdecea;
    color: var(--color-error);
    border: 1px solid #f5c6cb;
  }
  .msg.success {
    background: #eaf6ee;
    color: var(--color-success);
    border: 1px solid #c3e6cb;
  }
  .hidden { display: none !important; }
  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    padding: 4px 0;
  }
  .summary-row.total {
    font-weight: bold;
    font-size: 1.05rem;
    border-top: 1px solid var(--color-border);
    margin-top: 6px;
    padding-top: 8px;
  }
  .complete-box {
    text-align: center;
    padding: 30px 20px;
  }
  .complete-box .big-check {
    font-size: 3rem;
    color: var(--color-success);
  }
  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--color-muted);
    padding: 20px;
  }
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }


  /* 地図。高さを固定しつつ、幅は端末に合わせる */
  .map-wrap {
    position: relative;
    width: 100%;
    height: 320px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--color-border);
    margin-bottom: 12px;
  }
  .map-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* 経路ボタン。現地で押されるので、指で押しやすい大きさにする */
  .map-btn {
    display: block;
    text-align: center;
    padding: 14px 16px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
  .addr-line { font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
  /* 本文中のリンク。経路ボタンほど強くせず、押せることは分かるようにする */
  .access-link {
    display: inline-block;
    color: var(--color-accent-dark);
    font-weight: 600;
    text-decoration: underline;
    padding: 4px 0;
  }
  .access-list { padding-left: 1.2em; margin: 6px 0 0; }
  .access-list li { margin-bottom: 6px; }
  .back-link { display: inline-block; margin-top: 8px; }

</style>
</head>

<header class="hero">
  <h1 data-i18n="h1">アクセス</h1>
  <p data-i18n="sub">KKRホテル大阪 4階 美容室</p>
  <div class="lang-switch" id="langSwitch"></div>
</header>

<main>

  <div class="card">
    <h2 data-i18n="addrTitle">所在地</h2>
    <p class="addr-line" data-i18n="venue">KKRホテル大阪</p>
    <p data-i18n="addr">〒540-0007 大阪府大阪市中央区馬場町2-24 4階</p>
    <p data-i18n="floor">4階 美容室（フロントでお尋ねください）</p>
  </div>

  <div class="card">
    <div class="map-wrap">
      <iframe src="https://www.google.com/maps?q=KKR%E3%83%9B%E3%83%86%E3%83%AB%E5%A4%A7%E9%98%AA&output=embed&hl=ja" allowfullscreen loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              title="KKR Hotel Osaka map"></iframe>
    </div>
    <a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=KKR%E3%83%9B%E3%83%86%E3%83%AB%E5%A4%A7%E9%98%AA" target="_blank" rel="noopener"
       data-i18n="mapBtn">Googleマップで経路を見る</a>
  </div>

  <div class="card">
    <h2 data-i18n="trainTitle">電車でお越しの場合</h2>
    <ul class="access-list">
      <li data-i18n="train1"></li>
      <li data-i18n="train2"></li>
    </ul>
    <h3 data-i18n="landmarkTitle">目印</h3>
    <p data-i18n="landmark"></p>
  </div>

  <div class="card">
    <h2 data-i18n="shuttleTitle">無料シャトルバス</h2>

    <p data-i18n="shuttleFreq"></p>

    <h3 data-i18n="shuttleStopTitle">乗り場</h3>

    <p><a class="access-link" href="https://www.google.com/maps/search/?api=1&query=%E3%83%A2%E3%82%B9%E3%83%90%E3%83%BC%E3%82%AC%E3%83%BC%E6%A3%AE%E3%83%8E%E5%AE%AE%E5%BA%97" target="_blank" rel="noopener"
          data-i18n="shuttleStopMap">乗り場（モスバーガー前）を地図で見る</a></p>

    <p><a class="access-link" href="https://osaka.kkr.or.jp/access/" target="_blank" rel="noopener"
          data-i18n="shuttleTimetable">正確な時刻はホテル公式サイトでご確認ください</a></p>
    <p class="field-hint" data-i18n="shuttleNote"></p>
  </div>

  <div class="card">
    <h2 data-i18n="onArrivalTitle">ご到着後</h2>
    <p data-i18n="onArrival"></p>
    <p class="field-hint" data-i18n="arriveEarly"></p>
  </div>

  <div class="card">
    <h2 data-i18n="contactTitle">お問い合わせ</h2>
    <p id="phoneOut"></p>
    <a class="back-link" href="./" data-i18n="backToBooking">予約ページへ戻る</a>
  </div>

</main>

<footer>
  <span data-i18n="contactTitle">お問い合わせ</span>: <span id="footerPhone"></span>
</footer>

  var LANG_LABELS = { ja: '日本語', en: 'English', 'zh-CN': '简体', 'zh-TW': '繁體', ko: '한국어', fr: 'Français' };
  var SUPPORTED_LANGS = ['ja', 'en', 'zh-CN', 'zh-TW', 'ko', 'fr'];

  // 予約ページと同じ電話番号を出す。GASを叩かずに済むよう直接持つ
  // （このページは確認メールから開かれるため、通信が細い場所でも開けるようにする）
  var SALON_PHONE = '06-6941-1122';

  var state = { lang: detectInitialLang() };

  function detectInitialLang() {
    // 予約ページから ?lang= で渡ってきたらそれを優先する
    var m = /[?&]lang=([\w-]+)/.exec(location.search);
    if (m && SUPPORTED_LANGS.indexOf(m[1]) !== -1) return m[1];
    var nav = (navigator.language || 'en');
    if (SUPPORTED_LANGS.indexOf(nav) !== -1) return nav;
    var base = nav.split('-')[0];
    for (var i = 0; i < SUPPORTED_LANGS.length; i++) {
      if (SUPPORTED_LANGS[i].split('-')[0] === base) return SUPPORTED_LANGS[i];
    }
    return 'en';
  }

  function t(key) {
    var d = I18N[state.lang] || I18N.en;
    return d[key] || I18N.en[key] || key;
  }

  function applyI18n() {
    document.documentElement.lang = state.lang;
    document.title = t('title');
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    }
    // ホテルのフロントにつながる番号なので、その旨を添える
    var phoneText = SALON_PHONE + '（' + t('phoneLabelFront') + '）';
    document.getElementById('phoneOut').textContent = phoneText;
    document.getElementById('footerPhone').textContent = phoneText;
  }

  function renderLangSwitch() {
    var box = document.getElementById('langSwitch');
    box.innerHTML = '';
    SUPPORTED_LANGS.forEach(function (lang) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = LANG_LABELS[lang];
      if (lang === state.lang) btn.classList.add('active');
      btn.addEventListener('click', function () {
        state.lang = lang;
        renderLangSwitch();
        applyI18n();
      });
      box.appendChild(btn);
    });
  }

  renderLangSwitch();
  applyI18n();
})();
</script>
